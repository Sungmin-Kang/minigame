<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16112a">
<meta name="description" content="계정 없이 QR로 참가하는 8인 야유회 파티게임">
<title>야유회 파티박스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: game-show stage. Host = wide TV board with marquee header; player = one phone controller whose top half is a cartoon scene. */
:root{
  --bg:#16112a; --stage:#211a3c; --panel:#2a2250; --line:#41377a;
  --fg:#f7f2ff; --muted:#b0a6d6; --bulb:#ffd64d; --hot:#ff5e78; --ok:#46d68c; --ink:#1d1633;
  --t0:#ff6157; --t1:#4aa8ff; --t2:#45d281; --t3:#ff9a3d;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.qrcard{justify-items:center;text-align:center}
.qrcard img{background:#fff;padding:12px;border-radius:16px;width:min(260px,70vw);height:auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--line);z-index:8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tabbar button{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;font-weight:700;font-size:1rem}
.tabbar button.on{background:var(--bulb);color:#241a00;border-color:var(--bulb)}
.tbadge{position:absolute;top:8px;right:12px;width:12px;height:12px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 3px var(--bg);animation:bulbs 1s steps(2) infinite}
#app.hyb{padding-bottom:96px}
.spec .btn,.spec .cfgcard,.spec [data-act],.spec label:has(#cdbl){display:none!important}
.spec .tile{pointer-events:none}
.spec .lstage{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.spec .lcard .ln{font-size:1.15rem}
.spec .lbub{font-size:1.3rem}
.vsbox{display:flex;flex-direction:column;gap:14px}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vsside .lcard{max-width:260px;margin:0 auto}
.vsside .lcard .ch{width:86%;max-width:200px}
.vsmid{display:flex;flex-direction:column;align-items:center;gap:6px}
.vsword{font-family:var(--display);font-size:clamp(2.4rem,9vw,5rem);color:var(--hot);-webkit-text-stroke:3px var(--ink);paint-order:stroke;line-height:1}
.vsword.pop{animation:signpopb .5s cubic-bezier(.3,1.8,.6,1)}
.vsscore{font-size:1.4rem;display:flex;gap:8px;flex-wrap:wrap}
.vslist{display:grid;gap:6px}
.vsli{display:grid;grid-template-columns:2em 1fr auto 1fr auto;gap:8px;align-items:center;background:var(--panel);border-radius:10px;padding:6px 10px;font-size:.95rem;min-width:0}
.vsli>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsli.cur{outline:2px solid var(--bulb)}.vsli.next{opacity:.6}
.spec .vsside .lcard .ch{max-width:260px}.spec .vsli{font-size:1.1rem}
.pill.live{background:var(--hot);color:#fff;border-color:var(--hot);font-weight:700;animation:bulbs 1s steps(2) infinite}
.lstage{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.lcard{position:relative;background:var(--panel);border-radius:16px;padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:5px solid var(--tc);min-width:0;overflow:hidden}
.lcard .ch{width:78%;max-width:120px}.lcard .ch svg{width:100%;height:auto}
.lcard .ln{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .lcap{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.3em}
.lbub{position:absolute;top:6px;right:6px;z-index:2;background:#fff;color:var(--ink);font-family:var(--display);font-size:1rem;padding:2px 8px;border-radius:10px;border:2px solid var(--ink);animation:signpopb .3s cubic-bezier(.3,1.8,.6,1)}
@keyframes signpopb{from{transform:scale(.3)}to{transform:scale(1)}}
.bigcode{font-family:var(--display);font-size:3.2rem;letter-spacing:.2em;color:var(--bulb);line-height:1}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--bulb);outline-offset:2px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
#app{min-height:100%;padding:16px;padding-block:16px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.btn{border-radius:12px;padding:12px 18px;background:var(--panel);font-weight:700;border:1px solid var(--line)}
.btn:hover{border-color:var(--muted)}
.btn.go{background:var(--bulb);color:#241a00;border-color:var(--bulb)}
.btn.hot{background:var(--hot);color:#2a0008;border-color:var(--hot)}
.btn.big{font-size:1.15rem;padding:16px 26px}
.btn:disabled{opacity:.4;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--panel);font-size:.85rem;border:1px solid var(--line)}
.label{font-size:.78rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
.card{background:var(--stage);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
input[type=text],textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit}
textarea{min-height:150px;font-size:.92rem;line-height:1.6}
.t0{--tc:var(--t0)}.t1{--tc:var(--t1)}.t2{--tc:var(--t2)}.t3{--tc:var(--t3)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--tc,var(--muted));display:inline-block;flex:none}

/* marquee */
.marquee{position:relative;border-radius:22px;padding:22px 26px;background:var(--stage);border:2px solid var(--line)}
.marquee::before{content:"";position:absolute;inset:6px;border-radius:16px;pointer-events:none;
  background:radial-gradient(circle,var(--bulb) 2.2px,transparent 3px) 0 0/22px 22px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:5px;opacity:.75;animation:bulbs 1.2s steps(2) infinite}
@keyframes bulbs{50%{opacity:.35}}
.hdr{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.hdr h1{font-size:clamp(1.6rem,3.6vw,2.6rem);color:var(--bulb)}
.cast{display:flex;justify-content:center;align-items:flex-end;gap:2%;padding-top:8px;flex-wrap:wrap}
.cast>div{width:14%;max-width:120px;min-width:46px}
.cast>div:nth-child(odd){animation:bob 1.6s ease-in-out infinite}
.cast>div:nth-child(even){animation:bob 1.6s ease-in-out .8s infinite}

/* characters */
.chr{display:block;overflow:visible}
.chr .spin{transform-box:fill-box;transform-origin:center;animation:spin 1.4s linear infinite}
.chr .hatfly{transform-box:fill-box;transform-origin:center;animation:hatfly .7s ease-out forwards}
.chr .wag{transform-box:fill-box;transform-origin:0% 100%;animation:wag .25s ease-in-out infinite alternate}
.chr .drip{animation:drip 1s ease-in infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hatfly{to{transform:translate(-50px,-90px) rotate(-260deg);opacity:0}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}
.actor{position:absolute;bottom:4%;width:40%;max-width:220px;transition:left .45s cubic-bezier(.4,1.6,.6,1)}
.actor>svg{width:100%;height:auto}
.actor.flip>svg{transform:scaleX(-1)}
.tremble>svg{animation:tremble .18s linear infinite}
@keyframes tremble{25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,-1px)}}
.fall{transform-origin:50% 92%;animation:fall .5s cubic-bezier(.5,-.4,.7,1.3) forwards}
.fallr{transform-origin:50% 92%;animation:fallr .5s cubic-bezier(.5,-.4,.7,1.3) forwards}
@keyframes fall{to{transform:rotate(-82deg) translate(-6%,4%)}}
@keyframes fallr{to{transform:rotate(82deg) translate(6%,4%)}}
.jump{animation:jump .55s ease-in-out infinite}
.jump1{animation:jump .5s ease-out 1}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}}
.shake>svg{animation:shakeb .09s linear infinite}
@keyframes shakeb{0%{transform:rotate(-7deg) translateY(2px)}50%{transform:rotate(7deg) translateY(-3px)}100%{transform:rotate(-7deg) translateY(2px)}}

/* scenes */
.scene{position:relative;border-radius:24px;overflow:hidden;min-height:280px;aspect-ratio:5/4;max-height:52vh;width:100%;border:3px solid var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer}
.scene.short{aspect-ratio:16/9;min-height:190px;cursor:default}
.sign{position:absolute;left:50%;top:7%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(1.7rem,9vw,3.2rem);color:#fff;white-space:nowrap;paint-order:stroke;-webkit-text-stroke:7px var(--ink);text-align:center;z-index:3;line-height:1.1}
.sign.flash{color:var(--bulb);animation:signpop .35s cubic-bezier(.3,1.8,.6,1)}
.sign.bad{color:var(--hot)}
@keyframes signpop{from{transform:translateX(-50%) scale(.4)}to{transform:translateX(-50%) scale(1)}}
.bubble{position:absolute;background:#fff;color:var(--ink);font-family:var(--display);font-size:clamp(1.1rem,5vw,1.6rem);padding:6px 14px;border-radius:16px;border:3px solid var(--ink);z-index:2;white-space:nowrap}
.bubble::after{content:"";position:absolute;bottom:-12px;left:22px;border:8px solid transparent;border-top:10px solid var(--ink)}
.desert{background:linear-gradient(#ff8f5a 0,#ffc27a 52%,#e7a45e 52%,#c98647 100%)}
.desert .sun{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;background:#ffe9a3;left:37%;top:22%;box-shadow:0 0 0 14px #ffe9a355}
.desert .mesa{position:absolute;left:-5%;right:-5%;top:38%;height:15%;background:#b4553f;clip-path:polygon(0 100%,4% 30%,22% 30%,26% 100%,58% 100%,62% 10%,84% 10%,88% 100%)}
.desert .cactus{position:absolute;right:46%;bottom:34%;width:5%;height:18%;background:#3f8f4f;border-radius:8px;border:3px solid var(--ink)}
.tumble{position:absolute;bottom:6%;left:-20%;width:13%;aspect-ratio:1;border-radius:50%;border:4px dotted #8a5a2b;opacity:0}
.tumble.roll{animation:roll 3.2s linear}
@keyframes roll{0%{left:-15%;opacity:1;transform:rotate(0)}100%{left:110%;opacity:1;transform:rotate(900deg)}}
.party{background:radial-gradient(circle at 20% 20%,#ffd64d 0 4px,transparent 5px) 0 0/60px 60px,radial-gradient(circle at 70% 60%,#ff5e78 0 4px,transparent 5px) 0 0/70px 70px,radial-gradient(circle at 40% 80%,#4aa8ff 0 3px,transparent 4px) 0 0/50px 50px,linear-gradient(#7a3fb8,#4b2a86)}
.gauge{position:absolute;right:6%;top:18%;bottom:12%;width:8%;border-radius:20px;background:#ffffff33;border:3px solid var(--ink);overflow:hidden;display:flex;align-items:flex-end}
.gauge i{display:block;width:100%;background:linear-gradient(#fff,#ffe9a3);transition:height .1s}
.yard{background:linear-gradient(#8fd3ff 0,#bfe9ff 58%,#63c46a 58%,#3f9b4b 100%)}
.yard::before{content:"";position:absolute;left:8%;top:12%;width:22%;height:9%;background:#fff;border-radius:30px;box-shadow:120px 18px 0 -6px #fff}
.shop{background:#f3d6a4}
.room{background:linear-gradient(#f6e6c6 0,#f6e6c6 64%,#b98b5a 64%,#9a6f45 100%)}
.room::before{content:"";position:absolute;left:12%;right:12%;top:8%;height:34%;background:#2e5a46;border:8px solid #8a5a2b;border-radius:6px}
.studio{background:conic-gradient(from 160deg at 50% -10%,#ffffff22 0 10deg,transparent 10deg 30deg,#ffffff1a 30deg 40deg,transparent 40deg),linear-gradient(#2b1d5c,#140d30)}
.split{background:linear-gradient(90deg,#2c5f9e 0 50%,#9e3348 50% 100%)}
.split .side{position:absolute;top:8%;width:44%;font-family:var(--display);font-size:clamp(1rem,4.6vw,1.5rem);text-align:center;color:#fff;padding:0 4%;line-height:1.25;overflow-wrap:anywhere}
.podium{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:58%;height:24%;background:linear-gradient(#ff5e78,#c63c58);border:4px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;z-index:2;display:flex;align-items:center;justify-content:center;font-family:var(--display);color:#fff;font-size:clamp(1rem,5vw,1.5rem)}
.bucket{position:absolute;left:50%;top:-30%;width:22%;transform:translateX(-50%);z-index:3}
.bucket.tip{animation:tip .7s ease-in forwards}
@keyframes tip{40%{top:4%;transform:translateX(-50%) rotate(0)}100%{top:4%;transform:translateX(-50%) rotate(150deg)}}
.chair{position:absolute;bottom:3%;width:34%;left:33%;height:46%;z-index:0}
.confetti{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,#ffd64d 0 4px,transparent 5px) 0 0/40px 40px,radial-gradient(circle,#ff5e78 0 3px,transparent 4px) 15px 10px/34px 34px,radial-gradient(circle,#46d68c 0 3px,transparent 4px) 5px 20px/46px 46px;animation:conf 1.2s linear infinite}
@keyframes conf{from{background-position:0 -40px,15px -24px,5px -26px}to{background-position:0 0,15px 10px,5px 20px}}
.spot{position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) 70%,transparent 0 22%,#000a 34%)}
.hud{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hud .big{font-family:var(--display);font-size:2rem;color:var(--bulb)}

/* scoreboard */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.team{background:var(--panel);border-radius:16px;padding:14px 16px;border-top:6px solid var(--tc);min-width:0}
.team .nm{font-family:var(--display);font-size:1.35rem;color:var(--tc)}
.team .pt{font-family:var(--display);font-size:2.4rem;line-height:1.1}
.team .mem{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.heads{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.heads>.av{width:44px}

/* game tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:64px 1fr;gap:2px 12px;align-items:center;min-width:0}
.tile .art{grid-row:span 3;width:64px}
.tile:hover:not(:disabled){border-color:var(--bulb)}
.tile:hover:not(:disabled) .art{animation:jump .5s ease-in-out}
.tile .tn{font-family:var(--display);font-size:1.25rem;min-width:0}
.tile .tk{font-size:.78rem;color:var(--bulb);font-weight:700;letter-spacing:.08em}
.tile .td{font-size:.86rem;color:var(--muted);min-width:0}
.tile.done{opacity:.45}
.tile.done .tn{text-decoration:line-through}

/* host stage */
.stagebig{font-family:var(--display);font-size:clamp(2rem,6vw,4.4rem);line-height:1.15;text-align:center}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pc{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:6px 12px 6px 6px;border-left:5px solid var(--tc,var(--line));min-width:0}
.pc .av{width:40px;flex:none}
.pc .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.pc .s{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.pc.ok .s{color:var(--ok)}
.bar{height:14px;border-radius:7px;background:var(--bg);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--tc,var(--bulb));transition:width .2s}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:1.05rem}
.restab{width:100%;border-collapse:collapse;font-size:1rem}
.restab td,.restab th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
.restab th{font-size:.78rem;letter-spacing:.1em;color:var(--muted)}
.tablebox{overflow-x:auto}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;font-size:1.1rem;font-weight:700;text-align:center;min-width:0;overflow-wrap:anywhere}
.choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--panel))}
.choice.pick{border-color:var(--bulb)}
.vsbar{display:flex;height:46px;border-radius:12px;overflow:hidden;font-weight:700}
.vsbar>div{display:flex;align-items:center;justify-content:center;min-width:0;transition:flex .4s}
.nlog{display:flex;flex-wrap:wrap;gap:8px}
.nlog .nb{background:var(--panel);border-radius:14px;padding:6px 12px 6px 6px;display:flex;gap:8px;align-items:center;min-width:0}
.nlog .nb .av{width:34px}
.nlog .nb b{font-family:var(--display);font-size:1.5rem;color:var(--bulb)}
.nlog .nb.bad b{color:var(--hot)}
.podiumrow{display:flex;justify-content:center;align-items:flex-end;gap:3%;flex-wrap:wrap;min-height:200px;padding:20px 0 0;border-radius:18px;background:linear-gradient(transparent 72%,#00000033 72%)}
.tgroup{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.tgroup .ppl{display:flex;align-items:flex-end;gap:2px}
.tgroup .ppl>div{width:clamp(56px,9vw,110px)}
.tgroup .cap{font-family:var(--display);font-size:1.2rem;color:var(--tc)}
.bombwrap{width:min(280px,64vw);margin:0 auto;position:relative}
.bombwrap svg{width:100%;height:auto;display:block}
.bombwrap.run>svg{animation:pulse var(--sp,.8s) ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06) rotate(-3deg)}}

/* overlay */
#ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#ov .card{max-width:640px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
#ovt{font-family:var(--display);font-size:clamp(1.8rem,6vw,3.2rem);color:var(--bulb);min-height:1.3em}
#ova{width:140px}

/* phone */
.phone{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ptop .me{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.ptop .me .av{width:36px}
canvas{display:block;width:100%;max-width:100%;border-radius:24px;border:3px solid var(--ink);touch-action:manipulation}
.secret{border-radius:20px;padding:20px 18px;text-align:center;background:var(--panel);border:2px dashed var(--bulb);display:flex;flex-direction:column;align-items:center;gap:6px}
.secret .disp{font-size:clamp(2rem,11vw,3.2rem);color:var(--bulb)}
.secret .art{width:46%;max-width:180px}
.vlist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vote{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.vote .av{width:70%}
.vote.pick{border-color:var(--bulb);background:color-mix(in srgb,var(--bulb) 16%,var(--panel))}
.timerbar{height:10px;border-radius:5px;background:var(--panel);overflow:hidden}
.timerbar i{display:block;height:100%;background:var(--bulb);transform-origin:left}
@media (max-width:560px){.choices{grid-template-columns:1fr}.marquee{padding:18px}.vlist{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>

let S=null,H=null;
function newState(){return{e:rid(),v:0,ph:'lobby',g:null,r:null,pl:{},tm:[],done:[],dbl:false,d:{},res:null,pen:null,fin:[]}}
function cfgDefault(){return{teams:4,games:ORDER.slice(),mini:DEF_MINI.join('\n'),fin:DEF_FINAL.join('\n'),dbl:true}}
function startHost(){
  H={cfg:Object.assign(cfgDefault(),store.get('pb_cfg',{})),taps:{},raf:0,confirmReset:false,net:'wait',qr:null,qrFor:null};
  let code=store.get('pb_code2',null);if(!code){code=newCode();store.set('pb_code2',code)}
  room=makeHostNet(code,st=>{H.net=st;H.qrFor=null;schedRender()});
  S=store.get('pb_S',null);
  if(!S||!S.e){S=newState()}else{S.e=rid()}
  room.presence({role:'host'}).catch(()=>{});
  room.onPeers(ch=>{if(ch.joined.length)broadcast();hostPeers();});
  setInterval(broadcast,2500);
  setInterval(pushLive,3000);
  setInterval(hostTick,250);
  keepAwake();
  setS({});
}
function startHybrid(n){
  HYBRID=true;store.set('pb_nick',n.slice(0,12));
  app.classList.add('hyb');
  app.innerHTML=`<div id="playView"></div><div id="hostView" hidden></div><nav class="tabbar" id="tabbar" aria-label="화면 전환"><button type="button" data-tab="play">플레이</button><button type="button" data-tab="host">방장 진행<i class="tbadge" id="tbadge" hidden></i></button></nav>`;
  $('#tabbar').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{audio();setTab(b.dataset.tab)});
  startHost();
  PNET=room.local;
  startPlayer();
  setTab('host');
}
function setTab(t){TAB=t;if(!HYBRID)return;const pv=$('#playView'),hv=$('#hostView');if(pv)pv.hidden=t!=='play';if(hv)hv.hidden=t!=='host';window.scrollTo(0,0);updateTabs()}
function needsAction(){if(!S)return false;if(S.ph!=='play')return S.ph!=='lobby'||Object.keys(online()).length>1;const g=S.g,d=S.d||{};
  if(d.vs)return d.vs.mst==='win'&&d.vs.mi>=d.vs.pairs.length-1;
  if(['duel','stop','rhythm','mash'].includes(g)){const [k,n]=doneCount();return n>0&&k===n}
  if(g==='nunchi')return !!d.end;if(g==='quiz')return !!d.rev;return true}
function updateTabs(){if(!HYBRID)return;const bar=$('#tabbar');if(!bar)return;bar.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));const bd=$('#tbadge');if(bd)bd.hidden=!(TAB==='play'&&needsAction())}
function setS(p){if(SPEC)return;Object.assign(S,p);S.gl=H.cfg.games;S.v++;store.set('pb_S',S);broadcast();hostRender()}
function broadcast(){if(room&&S)room.emit('st',S).catch(()=>{})}
function saveCfg(){store.set('pb_cfg',H.cfg)}
function online(){const m={};for(const p of room.peers()){const pr=p.presence||{};if(pr.role==='host'||typeof pr.pid!=='string')continue;const pid=pr.pid.slice(0,24);if(!m[pid]||p.updatedAt>m[pid].u)m[pid]={n:String(pr.n||'??').slice(0,12),a:pr.a&&typeof pr.a==='object'?pr.a:null,u:p.updatedAt}}return m}
function members(t){return Object.keys(S.pl).filter(pid=>S.pl[pid].t===t)}
function activePids(){const on=online();return Object.keys(S.pl).filter(pid=>S.pl[pid].t>=0&&on[pid])}
function inp(pid,on){const a=(on||online())[pid];return a&&a.a&&a.a.r===S.r?a.a:null}
function tc(t){return t>=0?'t'+t:''}
function hostPeers(){
  if(SPEC)return;
  const on=online();let ch=false;
  for(const pid in S.pl){if(on[pid]&&on[pid].n!==S.pl[pid].n){S.pl[pid].n=on[pid].n;ch=true}}
  if(S.ph==='play'&&S.g==='nunchi')nunchiHost(on);
  if(ch)setS({});else schedRender();
  pushLive();
}
function pushLive(){if(SPEC||!room||!room.live||!S||!H)return;const now=Date.now();if(H.lvT&&now-H.lvT<500){clearTimeout(H.lvTo);H.lvTo=setTimeout(pushLive,520);return}H.lvT=now;const on=online(),o={};for(const pid in on)o[pid]=[on[pid].n,on[pid].a&&on[pid].a.r===S.r?on[pid].a:null];room.live({r:S.r,on:o})}
function schedRender(){if(H.raf)return;H.raf=requestAnimationFrame(()=>{H.raf=0;hostRender()})}

function assignTeams(){
  const n=H.cfg.teams,on=online(),pids=shuffle(Object.keys(on));
  const pl={};pids.forEach((pid,i)=>pl[pid]={n:on[pid].n,t:i%n});
  const tm=Array.from({length:n},(_,i)=>({n:TEAMS[i].n,s:0}));
  setS({pl,tm,ph:'teams'});
}
function addLate(){
  const on=online(),pl=Object.assign({},S.pl);
  for(const pid in on){if(!pl[pid]||pl[pid].t<0){const sizes=S.tm.map((_,t)=>Object.values(pl).filter(p=>p.t===t).length);const t=sizes.indexOf(Math.min(...sizes));pl[pid]={n:on[pid].n,t}}}
  setS({pl});
}
function unassigned(){const on=online();return Object.keys(on).filter(pid=>!S.pl[pid]||S.pl[pid].t<0)}

function openGame(g){const left=H.cfg.games.filter(k=>!S.done.includes(k)&&k!==g);setS({ph:'intro',g,dbl:!!H.cfg.dbl&&left.length===0,res:null,pen:null,d:{}})}
function startGame(mode){
  const g=S.g,r=rid();let d={};
  if(g==='duel')d={ds:[0,1,2].map(()=>1500+Math.floor(Math.random()*3000))};
  if(g==='rhythm')d={p:Math.floor(Math.random()*RHY.length)};
  if(g==='nunchi'){H.taps={};d={log:[],end:false}}
  if(g==='balance')d={qs:shuffle(BAL.map((_,i)=>i)).slice(0,3),qi:0,rev:false,cnt:null};
  if(g==='quiz')d={qs:shuffle(QUIZ.map((_,i)=>i)).slice(0,5),qi:0,rev:false,qt:Date.now()};
  if(g==='liar'){const cat=pick(Object.keys(LIAR)),ps=activePids();d={cat,w:Math.floor(Math.random()*LIAR[cat].length),liar:ps.length?pick(ps):null,st:'talk',tt:Date.now(),out:null}}
  if(g==='bomb')d={n:0,st:'ready',cat:pick(BOMB),loses:[]};
  if(mode==='vs'&&VSG.includes(g)&&S.tm.length>=2){const pairs=makePairs();if(pairs.length){d.vs={pairs,mi:0,mst:'vs',at:Date.now(),res:[]};setS({ph:'play',r,d});return}}
  setS({ph:'play',r,d});
  if(HYBRID&&g!=='bomb')setTab('play');
}

/* nunchi: host-side timing */
function nunchiHost(on){
  if(S.d.end)return;const now=performance.now();let added=false;
  for(const pid of activePids()){const a=inp(pid,on);if(a&&a.tap&&!H.taps[pid]){H.taps[pid]=now;added=true}}
  if(added)nunchiRecalc();
}
function groupTaps(taps){const arr=Object.entries(taps).sort((a,b)=>a[1]-b[1]),groups=[];for(const [pid,t] of arr){const g=groups[groups.length-1];if(g&&t-g.last<=700){g.p.push(pid);g.last=t}else groups.push({p:[pid],last:t})}return groups.map(g=>g.p)}
function nunchiRecalc(final){
  const log=groupTaps(H.taps),act=activePids(),left=act.filter(p=>!H.taps[p]);
  const end=final||left.length<=1;if(end&&left.length)log.push(left.concat(['__last']));
  S.d.log=log;
  if(end&&!final){clearTimeout(H.nt);H.nt=setTimeout(()=>nunchiRecalc(true),800);setS({})}
  else{if(final)S.d.end=true;setS({})}
}

/* scoring */
function personal(g,pid,on){
  const a=inp(pid,on);
  if(g==='duel')return a&&Array.isArray(a.ms)&&a.ms.length?a.ms.reduce((x,y)=>x+y,0)/a.ms.length:null;
  if(g==='mash')return a&&typeof a.c==='number'?a.c:null;
  if(g==='stop')return a&&typeof a.t==='number'?Math.abs(a.t-10):null;
  if(g==='rhythm')return a&&typeof a.sc==='number'?a.sc:null;
  if(g==='nunchi'){for(const grp of (S.d.log||[])){if(grp.includes(pid))return(grp.length===1)?1:0}return 0}
  if(g==='balance'){let s=0;S.d.qs.forEach((q,qi)=>{const c=balCount(qi,on);const v=a&&a.v?a.v[qi]:undefined;if(v===0||v===1){if(c[v]>=c[1-v])s++}});return s}
  if(g==='quiz'){let s=0;S.d.qs.forEach((q,qi)=>{const x=a&&a.q?a.q[qi]:null;if(Array.isArray(x)&&x[0]===QUIZ[q][2])s+=Math.round(500+500*Math.max(0,1-x[1]/15000))});return s}
  if(g==='liar'){const o=S.d.out;if(!o)return null;const isL=pid===S.d.liar;if(o==='caught')return isL?0:1;return isL?2:0}
  return null;
}
function balCount(qi,on){const c=[0,0];for(const pid of activePids()){const a=inp(pid,on);const v=a&&a.v?a.v[qi]:undefined;if(v===0||v===1)c[v]++}return c}
function finishGame(){
  const g=S.g,on=online(),dir=GAMES[g].dir,n=S.tm.length;
  const rows=[],tv=S.tm.map(()=>[]);
  if(g!=='bomb'){for(const pid of activePids()){const v=personal(g,pid,on),t=S.pl[pid].t;rows.push([S.pl[pid].n,t,g==='nunchi'?(v?'생존':'탈락'):g==='liar'?(pid===S.d.liar?'라이어':'시민')+' · '+v+'점':fmt(g,v)]);if(v!=null)tv[t].push(v)}}
  let vals;
  if(g==='bomb')vals=S.tm.map((_,t)=>-S.d.loses.filter(x=>x===t).length);
  else vals=tv.map(a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null);
  const key=v=>v==null?-Infinity:(dir==='low'?-v:v);
  const tr=vals.map((v,t)=>{const rank=1+vals.filter(w=>key(w)>key(v)).length;let p=(PTS[n]||PTS[4])[rank-1]||0;if(v==null)p=0;if(S.dbl)p*=2;return[t,g==='bomb'?(-v)+'회 폭발':g==='nunchi'?Math.round((v||0)*100)+'% 생존':fmt(g,v),rank,p]});
  const tm=S.tm.map((x,t)=>({n:x.n,s:x.s+tr[t][3]}));
  tr.sort((a,b)=>a[2]-b[2]);
  rows.sort((a,b)=>a[1]-b[1]);
  fanfare();
  setS({ph:'res',tm,done:S.done.concat([g]),res:{rows:rows.slice(0,12),tr}});
}
function lastTeams(){if(!S.res)return[];const tr=S.res.tr,mx=Math.max(...tr.map(x=>x[2]));if(mx===1)return[];return tr.filter(x=>x[2]===mx).map(x=>x[0])}

/* roulette overlay */
// Host spins: the roulette (list, landing value, who it's for) is published in the state so phones and spectators play the same spin.
function spin(list,label,sub,cb,t){
  const final=pick(list);let show=shuffle(list).slice(0,12);if(!show.includes(final))show[show.length?show.length-1:0]=final;
  S.spin={id:rid(),list:show,final,label,sub:sub||'',t:t??null,v:S.v+1};setS({});
  spinAnim(S.spin,()=>cb(final));
}
let SEEN_SPIN=null;
function spinAnim(sp,done){
  SEEN_SPIN=sp.id;const ov=$('#ov'),el=$('#ovt'),b=$('#ovb'),A=$('#ova'),list=sp.list.length?sp.list:[sp.final],t=sp.t;
  $('#ovl').textContent=sp.label;$('#ovs').textContent=sp.sub;A.innerHTML=t!=null?chr({c:TC[t],id:'pen'+t,face:'sweat',arms:'up'}):'';b.hidden=true;ov.hidden=false;
  let i=0,delay=50;
  (function step(){el.textContent=i>=24?sp.final:list[i%list.length];beep(400+(i%5)*60,.05,'square',.12);i++;
    if(i<=24){delay*=1.1;setTimeout(step,delay)}else{womp();if(t!=null)A.innerHTML=chr({c:TC[t],id:'pen'+t,face:'cry'});
      if(done){b.hidden=false;b.onclick=()=>{ov.hidden=true;done()};b.focus()}else setTimeout(()=>{if(SEEN_SPIN===sp.id)ov.hidden=true},2600)}})();
}
function watchSpin(s){if(!s||!s.spin||s.spin.id===SEEN_SPIN)return;if(typeof s.spin.v==='number'&&s.spin.v<s.v-1){SEEN_SPIN=s.spin.id;return}if(PR)return;spinAnim(s.spin,null)}
function lines(s){return s.split('\n').map(x=>x.trim()).filter(Boolean)}

/* host timers */
function hostTick(){
  if(!S)return;
  if(HYBRID)updateTabs();
  document.querySelectorAll('[data-cd]').forEach(el=>{const end=+el.dataset.cd;const s=Math.max(0,Math.ceil((end-Date.now())/1000));el.textContent=s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s+'초'});
  if(!SPEC)vsTick();
  if(S.ph==='play'&&S.g==='quiz'&&!S.d.rev){const on=online(),act=activePids();const all=act.length&&act.every(pid=>{const a=inp(pid,on);return a&&a.q&&a.q[S.d.qi]});if(all||Date.now()-S.d.qt>15500){S.d.rev=true;beep(880,.15);setS({})}}
  if(S.ph==='play'&&S.g==='bomb'&&S.d.st==='run'){const left=S.d.fuse-(Date.now()-S.d.t0);if(left<=0){S.d.st='boom';boom();setS({})}else{const iv=left>12000?900:left>5000?500:220;if(!H.lt||Date.now()-H.lt>iv){H.lt=Date.now();beep(1200,.04,'square',.18)}const b=$('.bombwrap');if(b)b.style.setProperty('--sp',(iv/1000)+'s')}}
}

function hostRender(){

  const buckets=S.tm.map((_,t)=>shuffle(activePids().filter(p=>S.pl[p].t===t))).filter(b=>b.length);
  const pairs=[],used=[];
  while(buckets.filter(b=>b.length).length>=2){
    const live=buckets.filter(b=>b.length).sort((x,y)=>y.length-x.length||Math.random()-.5);
    const a=live[0].pop(),b=live[1].pop();pairs.push([a,b]);used.push(a,b);

}

function bindHost(){
  HV().querySelectorAll('[data-teams]').forEach(b=>b.onclick=()=>{H.cfg.teams=+b.dataset.teams;saveCfg();hostRender()});
  HV().querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const k=b.dataset.tg,g=H.cfg.games;H.cfg.games=g.includes(k)?g.filter(x=>x!==k):ORDER.filter(x=>g.includes(x)||x===k);saveCfg();hostRender()});
  const cd=$('#cdbl');if(cd)cd.onchange=()=>{H.cfg.dbl=cd.checked;saveCfg()};
  const tm=$('#tmini');if(tm){tm.oninput=()=>{H.cfg.mini=tm.value;saveCfg()}}
  const tf=$('#tfin');if(tf){tf.oninput=()=>{H.cfg.fin=tf.value;saveCfg()}}
  HV().querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openGame(b.dataset.open));
  HV().querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{S.d.out=b.dataset.lg==='right'?'escaped':'caught';S.d.st='done';setS({})});
  HV().querySelectorAll('[data-bl]').forEach(b=>b.onclick=()=>{const d=S.d;d.loses.push(+b.dataset.bl);d.n++;if(d.n>=3){finishGame()}else{d.st='ready';d.cat=pick(BOMB);setS({})}});
  HV().querySelectorAll('[data-fin]').forEach(b=>b.onclick=()=>{const t=+b.dataset.fin;const used=S.fin.map(f=>f[1]);let list=lines(H.cfg.fin).filter(x=>!used.includes(x));if(!list.length)list=lines(H.cfg.fin);if(!list.length)list=DEF_FINAL;spin(list,'최종 벌칙',S.tm[t].n+'팀',txt=>setS({fin:S.fin.concat([[t,txt]])}),t)});
  HV().querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{audio();const a=b.dataset.act;
    if(a==='assign')assignTeams();
    if(a==='board'){H.confirmReset=false;setS({ph:'board',g:null,r:null,d:{}})}
    if(a==='late')addLate();
    if(a==='start')startGame();
    if(a==='startvs')startGame('vs');
    if(a==='vsgo')vsGo();
    if(a==='vsjudge')vsJudge();
    if(a==='vsnext')vsNext();
    if(a==='finish'){if(S.d&&S.d.vs)finishVs();else finishGame()}
    if(a==='nend')nunchiRecalc(true);
    if(a==='brev'){S.d.rev=true;S.d.cnt=balCount(S.d.qi,online());setS({})}
    if(a==='bnext'){S.d.qi++;S.d.rev=false;S.d.cnt=null;setS({})}
    if(a==='qrev'){S.d.rev=true;setS({})}
    if(a==='qnext'){S.d.qi++;S.d.rev=false;S.d.qt=Date.now();setS({})}
    if(a==='lvote'){S.d.st='vote';setS({})}
    if(a==='lrev'){const on=online(),tally={};activePids().forEach(p=>{const x=inp(p,on);if(x&&x.vote&&S.pl[x.vote])tally[x.vote]=(tally[x.vote]||0)+1});const mx=Math.max(0,...Object.values(tally));const top=Object.keys(tally).filter(k=>tally[k]===mx);S.d.tally=tally;if(mx>0&&top.length===1&&top[0]===S.d.liar){S.d.st='guess'}else{S.d.st='done';S.d.out='escaped'}setS({})}
    if(a==='bstart'){S.d.st='run';S.d.t0=Date.now();S.d.fuse=20000+Math.floor(Math.random()*30000);setS({})}
    if(a==='bcat'){S.d.cat=pick(BOMB);setS({})}
    if(a==='pen'){const ts=lastTeams();spin(lines(H.cfg.mini).length?lines(H.cfg.mini):DEF_MINI,'벌칙 뽑기',ts.map(t=>S.tm[t].n+'팀').join(', '),txt=>setS({ph:'pen',pen:{teams:ts,text:txt}}),ts[0])}
    if(a==='final')setS({ph:'final',g:null});
    if(a==='practice')practiceMenu(()=>hostRender());
    if(a==='reset'){if(!H.confirmReset){H.confirmReset=true;hostRender();return}H.confirmReset=false;S=newState();setS({})}
  });
}

let P=null,PLV=null;const PLV_CB=new Set();
function plvA(pid,s){return PLV&&PLV.r===s.r&&PLV.on&&Array.isArray(PLV.on[pid])?PLV.on[pid][1]:null}
function playKey(s){if(!s||s.ph!=='play')return null;const v=s.d&&s.d.vs;if(!v)return s.r;return v.mst==='go'&&(v.pairs[v.mi]||[]).includes(P.pid)?s.r:'vsw'}
function startPlayer(){
  const pid=getPid();
  P={pid,n:store.get('pb_nick',''),S:null,ep:null,v:-1,joined:false,game:null,key:null};
  PNET=PNET||room;
  PNET.on('st',m=>{const s=m.data;if(!s||typeof s!=='object'||!s.e)return;if(s.e===P.ep&&s.v<=P.v)return;P.ep=s.e;P.v=s.v;P.S=s;if(!HYBRID)watchSpin(s);pRender()});
  PNET.on('lv',m=>{PLV=m.data;PLV_CB.forEach(f=>{try{f()}catch(e){}})});

}

    PV().innerHTML=`<div class="phone"><div class="marquee"><div class="label">야유회 파티박스</div><h1 style="color:var(--bulb);font-size:2rem">참가하기</h1>${bigChr({c:TC[hsh(P.pid)%4],id:P.pid,face:'happy',arms:'up'},'jump')}</div>

    <p class="muted" style="margin:0">소리가 나는 게임이 있으니 무음을 꺼 주세요.</p>

    $('#jf').onsubmit=e=>{e.preventDefault();audio();join($('#nick').value)};const pb=$('#prac');if(pb)pb.onclick=()=>practiceMenu(()=>pRender());updateTabs();return;

    let cat=pick(BOMB),st='ready',t0=0,fuse=0,lt=0;const c=TC[0];
    const draw=()=>{gm.innerHTML=`<div class="card grid" style="text-align:center"><div class="label">주제</div><div class="disp" style="font-size:1.8rem">${esc(cat)}</div><div class="bombwrap ${st==='run'?'run':''}">${bombSVG(st)}</div>
      ${st==='ready'?`<div class="row" style="justify-content:center"><button class="btn go big" id="bs">점화!</button><button class="btn" id="bc">주제 바꾸기</button></div>`:st==='run'?'<p class="muted" style="margin:0">단어를 외치세요! (연습은 10~25초)</p>':`${bigChr({c,id:me,hat:'afro',soot:true,face:'ko',stars:true})}<button class="btn go" id="bs2">한 번 더</button>`}</div>`;
      const bs=$('#bs',gm);if(bs)bs.onclick=()=>{audio();st='run';t0=Date.now();fuse=10000+Math.random()*15000;draw();loop()};
      const bc=$('#bc',gm);if(bc)bc.onclick=()=>{cat=pick(BOMB);draw()};
      const b2=$('#bs2',gm);if(b2)b2.onclick=()=>{st='ready';cat=pick(BOMB);draw()}};
    const loop=()=>{if(!PR||st!=='run')return;const left=fuse-(Date.now()-t0);if(left<=0){st='boom';boom();buzz();draw();return}
      const iv=left>8000?900:left>4000?500:220;if(Date.now()-lt>iv){lt=Date.now();beep(1200,.04,'square',.18)}const b=$('.bombwrap',gm);if(b)b.style.setProperty('--sp',iv/1000+'s');PR.raf=requestAnimationFrame(loop)};
    draw();note('실제 게임에서는 진행 화면에서 터지고, 폭탄을 든 팀을 진행자가 고릅니다.');
  }
}
</script>
